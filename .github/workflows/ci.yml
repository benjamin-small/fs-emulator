name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test, wasm32
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: sudo apt-get update && sudo apt-get install -y e2fsprogs
      - run: cargo test --workspace
      - run: cargo build --workspace --target wasm32-unknown-unknown

  wasm:
    name: wasm-pack test, build, demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/*/pnpm-lock.yaml
      - run: wasm-pack test --node crates/wasm
      - run: wasm-pack build crates/wasm --target bundler
      - run: pnpm install --frozen-lockfile
        working-directory: web/demo
      - run: pnpm build
        working-directory: web/demo
      - run: pnpm install --frozen-lockfile
        working-directory: web/ui
      - run: pnpm test
        working-directory: web/ui
      - run: pnpm build
        working-directory: web/ui
