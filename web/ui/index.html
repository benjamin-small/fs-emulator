<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>fs explorer</title>
    <script>
      // Dark is the default. A remembered light choice goes on the root before the app
      // loads so a reload never paints dark first. Same key as THEME_KEY in src/core/theme.ts.
      try {
        if (localStorage.getItem("fs-explorer.theme") === "light") document.documentElement.dataset.theme = "light";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
